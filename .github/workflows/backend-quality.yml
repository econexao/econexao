name: Backend quality

on:
  pull_request:
    paths:
      - "backend/**"
      - "supabase/**"
      - "docs/openapi.yaml"
      - ".github/workflows/backend-quality.yml"
  push:
    branches: [main, master]
    paths:
      - "backend/**"
      - "supabase/**"
      - "docs/openapi.yaml"
      - ".github/workflows/backend-quality.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/uv.lock

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.6"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend from frozen lock
        run: uv sync --frozen --extra dev

      - name: Ruff
        run: uv run ruff check app tests

      - name: Mypy
        run: uv run mypy app

      - name: Validate ordered Supabase migrations
        run: uv run python -m scripts.check_migrations

      - name: Validate migration security contracts
        run: >-
          uv run python -m pytest
          tests/test_check_migrations.py
          tests/test_rls_policies.py
          tests/test_media_lifecycle_schema.py

      - name: Tests, coverage, and secret scan
        run: uv run python -m pytest --cov=app --cov-report=term --cov-fail-under=85
